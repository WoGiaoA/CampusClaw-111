name: campusclaw
services:
 db:
  image: ${IMAGE_REGISTRY:-public.ecr.aws/docker/library}/mysql:8.4
  environment:
   MYSQL_DATABASE: ${MYSQL_DATABASE:-campusclaw}
   MYSQL_USER: ${MYSQL_USER:-campusclaw}
   MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD in .env}
   MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in .env}
  volumes:
   - db-data:/var/lib/mysql
  healthcheck:
   test: [CMD-SHELL, 'MYSQL_PWD="$$MYSQL_ROOT_PASSWORD" mysqladmin ping -h localhost --silent']
   interval: 10s
   timeout: 5s
   retries: 12
 api:
  build:
   context: .
   args:
    IMAGE_REGISTRY: ${IMAGE_REGISTRY:-public.ecr.aws/docker/library}
  environment:
   MYSQL_ADDR: db:3306
   APP_ENV: ${APP_ENV:-production}
   DEMO_MODE: ${DEMO_MODE:-false}
   MYSQL_DATABASE: ${MYSQL_DATABASE:-campusclaw}
   MYSQL_USER: ${MYSQL_USER:-campusclaw}
   MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD}
   SESSION_KEY: ${SESSION_KEY:?set SESSION_KEY}
   SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
   SEED_TEACHER_A_PASSWORD: ${SEED_TEACHER_A_PASSWORD:-}
   SEED_TEACHER_B_PASSWORD: ${SEED_TEACHER_B_PASSWORD:-}
   SEED_STUDENT_A1_PASSWORD: ${SEED_STUDENT_A1_PASSWORD:-}
   SEED_STUDENT_B1_PASSWORD: ${SEED_STUDENT_B1_PASSWORD:-}
   EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-}
   EMBEDDING_MODEL: ${EMBEDDING_MODEL:-}
   EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
   EMBEDDING_DIMENSION: ${EMBEDDING_DIMENSION:-}
   QDRANT_URL: http://qdrant:6333
   QDRANT_API_KEY: ${QDRANT_API_KEY:-}
   CHAT_BASE_URL: ${CHAT_BASE_URL:-}
   CHAT_MODEL: ${CHAT_MODEL:-}
   CHAT_API_KEY: ${CHAT_API_KEY:-}
   MCP_CREDENTIAL_KEY: ${MCP_CREDENTIAL_KEY:-}
   UPLOAD_DIR: /uploads
  volumes:
   - uploads:/uploads
  networks: [default, tools]
  depends_on:
   db:
    condition: service_healthy
  healthcheck:
   test: [CMD, campusclaw, healthcheck]
   interval: 10s
   timeout: 5s
   retries: 6
   start_period: 30s
 mcp-server:
  profiles: [mcp]
  build:
   context: .
   dockerfile: mcp-server/Dockerfile
   args:
    IMAGE_REGISTRY: ${IMAGE_REGISTRY:-public.ecr.aws/docker/library}
  environment:
   MCP_SERVER_TOKEN: ${MCP_SERVER_TOKEN:-}
  networks: [tools]
  healthcheck:
   test: [CMD, campus-mcp, healthcheck]
   interval: 10s
   timeout: 3s
   retries: 4
 qdrant:
  image: qdrant/qdrant:v1.14.1
  command: ["/bin/sh", "/qdrant-start.sh"]
  environment:
   QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY:-}
  volumes:
   - qdrant-data:/qdrant/storage
   - ./deploy/qdrant-entrypoint.sh:/qdrant-start.sh:ro
 web:
  image: ${IMAGE_REGISTRY:-public.ecr.aws/docker/library}/nginx:1.28-alpine
  ports:
   - '127.0.0.1:${WEB_PORT:-8080}:80'
  volumes:
   - ./web:/usr/share/nginx/html:ro
   - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
  depends_on:
   api:
    condition: service_healthy
  healthcheck:
   test: [CMD-SHELL, 'wget -qO- http://127.0.0.1/health >/dev/null']
   interval: 10s
   timeout: 5s
   retries: 3
networks:
 tools:
  internal: true
volumes:
 db-data:
 uploads:
 qdrant-data:
